name: Build Desktop

# 可复用的桌面构建流程（单架构）：Tauri 外壳 + PyInstaller 后端，签名 + 公证 + DMG。
# 由 tauri.yml（分支 CI）与 release.yml（tag 发版）通过 workflow_call 调用。

on:
  workflow_call:
    inputs:
      arch:
        description: '目标架构（arm64 / x86_64）'
        required: true
        type: string
      target:
        description: 'Rust target triple'
        required: true
        type: string

jobs:
  build-mac:
    name: Build macOS App (${{ inputs.arch }})
    # macos-14 镜像已于 2026-11-02 被 GitHub 退役（排队阶段即被拒，
    # runner_name 为空、job 1 秒 cancelled），故升到 macos-15（同为 Apple Silicon）。
    # 不用浮动的 latest 标签：它指向的版本会漂移，下次镜像退役又是同样的坑。
    runs-on: macos-15          # Apple Silicon runner，x86_64 通过 Rosetta 2 构建
    timeout-minutes: 60

    env:
      TARGET_ARCH: ${{ inputs.arch }}
      # Apple 证书（用于签名）
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      # Apple 公证凭证
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

    steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}
        lfs: true

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          tauri/package-lock.json

    # Rust 目标由输入指定；x86_64 在 arm64 runner 上交叉编译
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    # .cargo/config.toml 将 target-dir 指向 tauri/build/target
    - name: Rust Cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './tauri/src-tauri -> ../build/target'
        key: ${{ inputs.target }}
        cache-on-failure: true

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    # 仓库根目录的 .venv 同时供 PyInstaller 与 tauri.conf.json 的 beforeBuildCommand 使用
    - name: Set up Python environment (arm64)
      if: inputs.arch == 'arm64'
      run: |
        python3 -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/python -m pip install -r requirements.txt pyinstaller
        .venv/bin/python -c "import platform; print(f'Venv Python arch: {platform.machine()}')"

    # ── x86_64: 通过 Rosetta 2 + uv 跨平台安装 x86_64 依赖（PyInstaller 不支持交叉编译） ──
    #
    # 下面的 `arch -x86_64` 依赖 Rosetta 2。macos-15 镜像当前预装（实测：pkgutil 有
    # com.apple.pkg.RosettaUpdateAuto、`arch -x86_64 uname -m` → x86_64），但**不假设**
    # 它一直在——镜像会变，缺了就直接在 `arch -x86_64 python3 -m venv` 处失败。
    # 所以先显式探测，缺了再装。已装时 softwareupdate 也会成功退出，两种情形都容错。
    - name: Ensure Rosetta 2 (x86_64 only)
      if: inputs.arch == 'x86_64'
      run: |
        echo "=== runner ==="; sw_vers; uname -m; echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
        if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
          echo "✅ Rosetta 2 已可用，跳过安装"
        else
          echo "ℹ️ Rosetta 2 不可用，开始安装"
          sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
          if ! /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::error::Rosetta 2 安装后仍不可用，x86_64 交叉编译无法进行"
            exit 1
          fi
          echo "✅ Rosetta 2 安装完成"
        fi
        /usr/bin/arch -x86_64 /usr/bin/uname -m

    - name: Set up x86_64 Python environment via Rosetta 2
      if: inputs.arch == 'x86_64'
      run: |
        echo "🔧 Setting up x86_64 Python via Rosetta 2 + uv..."

        # 用 arch -x86_64 创建 x86_64 虚拟环境
        arch -x86_64 python3 -m venv .venv
        VENV="$GITHUB_WORKSPACE/.venv"

        # 将 venv 中的 universal Python 替换为纯 x86_64 binary，
        # 这样 sys.executable 和所有子进程都会以 x86_64 模式运行
        cp "$VENV/bin/python3" /tmp/python3_universal
        lipo -thin x86_64 /tmp/python3_universal -output /tmp/python3_x86_64
        rm "$VENV/bin/python3"
        mv /tmp/python3_x86_64 "$VENV/bin/python3"
        chmod +x "$VENV/bin/python3"

        if [ -L "$VENV/bin/python" ] || [ -f "$VENV/bin/python" ]; then
          rm "$VENV/bin/python"
          cp "$VENV/bin/python3" "$VENV/bin/python"
          chmod +x "$VENV/bin/python"
        fi
        lipo -info "$VENV/bin/python3"
        lipo -info "$VENV/bin/python"
        "$VENV/bin/python3" -c "import platform; print(f'Venv Python arch: {platform.machine()}')"

        # 用 uv 一次性安装 x86_64 wheel（无 wheel 时从源码编译）
        curl -LsSf https://astral.sh/uv/install.sh | sh
        UV="$HOME/.local/bin/uv"
        "$UV" pip install \
          --python "$VENV/bin/python3" \
          --python-version 3.11 \
          --python-platform x86_64-apple-darwin \
          -r requirements.txt
        "$UV" pip install \
          --python "$VENV/bin/python3" \
          --python-version 3.11 \
          --python-platform x86_64-apple-darwin \
          pyinstaller

        "$VENV/bin/python" --version
        "$VENV/bin/python" -c "import platform; print(f'Venv Python arch: {platform.machine()}')"

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Install Tauri CLI dependencies
      working-directory: tauri
      run: npm ci

    - name: Import Apple certificate
      if: ${{ env.APPLE_CERTIFICATE_P12 != '' }}
      env:
        KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
      run: |
        # 创建临时 keychain
        security create-keychain -p tempkey "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p tempkey "$KEYCHAIN_PATH"

        # 导入证书
        CERT_PATH="$RUNNER_TEMP/cert.p12"
        printf '%s' "$APPLE_CERTIFICATE_P12" | base64 -D > "$CERT_PATH"

        if [ ! -s "$CERT_PATH" ]; then
          echo "❌ Certificate file is empty or decode failed"
          exit 1
        fi

        security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k tempkey "$KEYCHAIN_PATH"

        # 设为默认 keychain（codesign 无需 --keychain 参数）
        security list-keychains -d user -s "$KEYCHAIN_PATH"
        security default-keychain -s "$KEYCHAIN_PATH"

        rm "$CERT_PATH"
        echo "✅ Certificate imported"

    # 有证书时：前端 → 后端 → app → 签名 → DMG → 公证（build_desktop.py 默认全流程）
    - name: Build Tauri app (signed + notarized)
      if: ${{ env.APPLE_CERTIFICATE_P12 != '' }}
      run: |
        .venv/bin/python tauri/scripts/build_desktop.py --arch ${{ inputs.arch }}

    # 无证书时（fork / 未配置 secrets）：构建未签名 DMG，仅用于验证构建链路
    - name: Build Tauri app (unsigned)
      if: ${{ env.APPLE_CERTIFICATE_P12 == '' }}
      run: |
        .venv/bin/python tauri/scripts/build_desktop.py \
          --arch ${{ inputs.arch }} \
          --action frontend,backend,app,zip

    - name: Show artifact
      run: ls -lh build/*.dmg

    # ── 产物架构自检：job 绿 ≠ 产物对 ──
    # x86_64 这一路是在 arm64 runner 上经 Rosetta 交叉编译出来的，构建成功只说明
    # 命令没报错，产物到底是哪个架构只有 file/lipo 能证明。所以在这里当场判。
    #
    # 判据：
    #   1) 主二进制 + 内嵌后端 Togobot-backend + 其余全部 Mach-O（86 个 .so/.dylib 等）
    #      都要等于 TARGET_ARCH（beta2 实测每份 88 个 Mach-O）；
    #   2) assets/execute/gtsp/ 下按设计同时带 darwin-amd64 与 darwin-arm64 两份，
    #      两份 DMG 里逐字节相同 —— 这是既存现状，不算架构违例，但缺了说明打包漏资产。
    - name: Verify DMG architecture
      # always()：DMG 若已生成，即使后续公证/校验步骤失败也要把架构判定跑出来。
      # 否则一次网络抖动就会让「产物到底是什么架构」无从证明——而 job 该红还是红，
      # 本步骤只是让证据可见，不掩盖失败。
      if: always()
      run: |
        set -euo pipefail
        EXPECT="${TARGET_ARCH}"
        # EXPECT 为空时下面的 *Mach-O*"${EXPECT}"* 会匹配任何 Mach-O，全绿——先挡掉。
        [ -n "${EXPECT}" ] || { echo "::error::TARGET_ARCH 为空，无法判定架构"; exit 1; }
        DMG=$(ls build/*.dmg | head -1)
        [ -n "${DMG}" ] || { echo "::error::build/ 下没有 DMG"; exit 1; }
        echo "DMG: ${DMG}   expect: ${EXPECT}"
        MNT=$(mktemp -d /tmp/dmgmnt.XXXXXX)
        # 必须把脚本自己的退出码带出 trap：否则 detach 的成败会覆盖判定结果，
        # 判据红了也照样 exit 0，step 表面绿——那是最坏的一种假绿。
        trap 'rc=$?; hdiutil detach "${MNT}" -quiet 2>/dev/null || true; exit ${rc}' EXIT
        hdiutil attach "${DMG}" -nobrowse -readonly -mountpoint "${MNT}" -quiet

        APP=$(/usr/bin/find "${MNT}" -maxdepth 1 -name '*.app' | head -1)
        [ -n "${APP}" ] || { echo "::error::DMG 内没有 .app"; exit 1; }
        EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP}/Contents/Info.plist")
        MAIN="${APP}/Contents/MacOS/${EXE}"
        BACKEND="${APP}/Contents/Resources/backend/Togobot-backend"
        MULTI="assets/execute/gtsp"

        fail=0
        # 判定用 `lipo -archs` 精确比对，不用 `file | grep`：后者在 universal
        # （fat）二进制上也会命中——某个 .so 退化成 x86_64+arm64 双份时会被判绿，
        # 而“全部为目标架构”恰恰要求 thin。fat 一律判红并打印实际架构列表。
        # lipo 对缺失/非 Mach-O 文件会非零退出，必须 || true：否则 set -e 会在
        # 循环中途打断脚本，后面的判据根本不跑，红得没有信息。
        arch_of() { lipo -archs "${1}" 2>/dev/null | tr -s ' ' | sed 's/ $//' || true; }

        echo "--- 判据1 关键二进制 ---"
        for f in "${MAIN}" "${BACKEND}"; do
          if [ ! -f "${f}" ]; then echo "::error::缺失 ${f}"; fail=1; continue; fi
          got=$(arch_of "${f}")
          echo "  ${f#"${APP}"/}"
          echo "    file: $(file -b "${f}")"
          echo "    lipo: ${got}"
          if [ "${got}" = "${EXPECT}" ]; then
            echo "     ✅ 等于 ${EXPECT}"
          else
            echo "::error::${f#"${APP}"/} 架构为「${got}」，期望「${EXPECT}」"; fail=1
          fi
        done

        echo "--- 判据2 全量 Mach-O 扫描（非目标架构仅允许命中容忍清单）---"
        # 不按目录排除，改成「精确相对路径」容忍清单：这样将来 assets/ 里新增别的
        # 多架构产物时会被当场判红，而不是被目录排除悄悄漏掉。
        TOLERATE_AMD64="Contents/Resources/backend/_internal/${MULTI}/gtsp-darwin-amd64"
        TOLERATE_ARM64="Contents/Resources/backend/_internal/${MULTI}/gtsp-darwin-arm64"
        tot=0; bad=0
        while IFS= read -r f; do
          got=$(arch_of "${f}")
          # 非 Mach-O（如 gtsp-linux-* 是 ELF）拿不到架构，跳过。
          [ -n "${got}" ] || continue
          tot=$((tot+1))
          rel="${f#"${APP}"/}"
          if [ "${got}" = "${EXPECT}" ]; then continue; fi
          case "${rel}" in
            "${TOLERATE_AMD64}") want=x86_64 ;;
            "${TOLERATE_ARM64}") want=arm64 ;;
            *) echo "     ❌ ${rel} → ${got}（不在容忍清单）"; bad=$((bad+1)); continue ;;
          esac
          if [ "${got}" = "${want}" ]; then
            echo "     容忍 ${rel} = ${want}"
          else
            echo "     ❌ ${rel} → ${got}，容忍清单声明 ${want}"; bad=$((bad+1))
          fi
        done < <(/usr/bin/find "${APP}" -type f -perm -u+x 2>/dev/null || true)
        echo "  Mach-O 合计 ${tot} 个，架构不符 ${bad} 个"
        # 守门下限：扫描本身失效（find 路径写错、过滤条件写错）时 tot 会是 0，
        # 此时 bad 也是 0，不设下限就等于空跑判绿。beta2/首轮实测每份 88 个，取 80。
        if [ "${tot}" -lt 80 ]; then
          echo "::error::只扫到 ${tot} 个 Mach-O（预期 ≥80，实测 88），扫描本身可疑"
          fail=1
        fi
        [ "${bad}" -eq 0 ] || fail=1

        echo "--- 判据3 多平台资产 ---"
        # 必需：gtsp-linux-*。依据 src/appPaths.py:117 get_gtsp_linux_binary_path(arch)
        #   按【容器架构】而非宿主架构选产物，arm64 宿主也要能跑 amd64 容器；
        #   scripts/togo_desktop.spec:90-91 注释亦明确不能误伤同目录的 gtsp-linux-*。
        for n in gtsp-linux-amd64 gtsp-linux-arm64; do
          if [ -f "${APP}/Contents/Resources/backend/_internal/${MULTI}/${n}" ]; then
            echo "  ✅ 必需资产存在 ${n}"
          else
            echo "::error::必需资产缺失 ${n}（打包态容器功能会整体不可用）"; fail=1
          fi
        done
        # 容忍：gtsp-darwin-*。现状是整棵 assets/ 原样打包，两份都在；但运行期
        #   只按宿主取一份，非目标那份无运行期需求。所以**不要求存在**（将来打包
        #   按架构过滤掉时不该判红），存在则架构必须对。
        for pair in "gtsp-darwin-amd64:x86_64" "gtsp-darwin-arm64:arm64"; do
          n=${pair%%:*}; want=${pair##*:}
          p="${APP}/Contents/Resources/backend/_internal/${MULTI}/${n}"
          if [ ! -f "${p}" ]; then
            echo "  -- 容忍资产未打包 ${n}（允许）"
            continue
          fi
          got=$(arch_of "${p}")
          if [ "${got}" = "${want}" ]; then
            echo "  ✅ ${n} = ${want}"
          else
            echo "::error::${n} 架构为「${got}」，期望「${want}」"; fail=1
          fi
        done

        if [ "${fail}" -eq 0 ]; then echo "RESULT: PASS (${EXPECT})"; else echo "RESULT: FAIL"; fi
        exit "${fail}"

    # 安装包统一上传为 workflow artifact；Release 发布由 release.yml 处理。
    # 不要用 archive: false（Direct Uploads）：该模式下 artifact 不是 zip，
    # actions/download-artifact 取回时会报 "Not a valid zip file" 而失败，
    # 且 name 参数被忽略导致 artifact 退化成裸文件名。保持默认打 zip。
    #
    # always()：DMG 做好之后才发生的失败（公证保外网校验、stapler validate 撞
    # CloudKit -1005 等）不该让整个产物人间蒸发——runner 已跑满十几分钟，重来
    # 一次代价很高。加 always() 后只要 DMG 落盘就上传，由人判断能否用。
    # 不会因此放出半成品：本 job 结论仍是 failure，release.yml 的 release job
    # 以 build-mac 成功为前置，失败 job 的 artifact 不会进 Release。
    # DMG 不存在时 if-no-files-found: error 会让本步骤红，这是期望行为，
    # 不许为了"绿"改成 warn。
    - name: Upload DMG artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: macOS-dmg-${{ inputs.arch }}
        path: build/*.dmg
        if-no-files-found: error
        retention-days: 30
