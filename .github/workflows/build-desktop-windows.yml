name: Build Desktop (Windows)

# Windows 桌面构建 + CI 内验证（#243）。
#
# 由 tauri.yml（分支 CI）与 release.yml（tag 发版）通过 workflow_call 调用，
# 避免两处维护同一套 Windows 构建步骤；也可手动 dispatch 单独验证。
# macOS 构建链路仍由 build-desktop.yml 负责。
#
# 产物形态选 NSIS（而非 msi）：
#   1) Tauri v2 在 Windows 上的默认打包器，单一 .exe 安装器；
#   2) 不需要 WiX 工具链（msi 走 WiX，CI 里多一层下载依赖，历史上同类外部依赖最易碎）；
#   3) 支持 `/S` 静默安装，正好用于「装完再验一遍」这一步。

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: win-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win:
    name: Build Windows NSIS installer
    # 供 sign-win 用的产物 id（SignPath 的 github-artifact-id 参数，见 #250）
    outputs:
      signing-artifact-id: ${{ steps.upload-for-signing.outputs.artifact-id }}
    # 钉 windows-2022，不用 windows-latest：浮动标签会随镜像更新漂移
    #（macos-14 被退役导致 job 1 秒 cancelled 就是前车之鉴）。
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      # scripts/togo_desktop.spec 读 TARGET_ARCH（Windows 上仅用于日志与一致性）
      TARGET_ARCH: x86_64
      # Windows 上 Python 的 stdout 默认是 cp1252（不是 UTF-8），而构建/验证脚本里有 emoji 与中文
      # 的 print，会直接 UnicodeEncodeError 炸在构建第一步（run 43617333776 实测：
      # build_desktop.py:72 print("🚀 ...") → 'charmap' codec can't encode）。
      # 强制 UTF-8 输出，避免为了「能打印」去改脚本里的文案（那是产品/工具代码，不该为 CI 编码问题让步）。
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@v6
      with:
        # LFS 必须拉：assets/execute/gtsp/gtsp-* 全是 LFS，其中一个就是 Windows 侧要用的
        # gtsp-windows-amd64.exe。LFS 没拉下来会是 ~130 字节指针文件，验证步骤会用体积下限挡掉。
        token: ${{ secrets.GH_PAT || github.token }}
        lfs: true
        fetch-depth: 0        # 「mac 零改动」的自证需要基线 commit 2debafad 在历史里

    - name: Record runner environment
      run: |
        Write-Host "runner   = $env:RUNNER_OS / $env:ImageOS / $env:ImageVersion"
        Write-Host "os       = $([System.Environment]::OSVersion.VersionString)"
        Write-Host "cargo    = $(cargo --version)"
        Write-Host "rustc    = $(rustc --version)"
        Write-Host "node     = $(node --version)"
        Write-Host "python   = $(python --version)"
        Write-Host "webview2 = $((Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv)"

    - name: Assert macOS build chain intact
      # macOS 构建链路必须保持可用。build-desktop.yml 相对基线零改动；
      # tauri.yml / release.yml 现在只新增 Windows 接入，仍需保留 build-mac 对
      # build-desktop.yml 的调用。
      run: |
        git diff --exit-code 2debafad -- .github/workflows/build-desktop.yml
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::build-desktop.yml 相对基线 2debafad 被改动，违反本单边界"
          exit 1
        }
        foreach ($file in @('.github/workflows/tauri.yml', '.github/workflows/release.yml')) {
          $hasMacJob = Select-String -Path $file -Pattern 'build-mac:' -Quiet
          $usesDesktop = Select-String -Path $file -Pattern 'build-desktop.yml' -Quiet
          if (-not $hasMacJob -or -not $usesDesktop) {
            Write-Host "::error::$file 的 macOS 构建链路缺失"
            exit 1
          }
        }
        Write-Host "OK: macOS 构建链路完整（build-desktop.yml 零改动，tauri.yml / release.yml 仍调用 build-mac）"
        Write-Host "--- spec 的 mac 分支等价性（EXE kwargs 只在 darwin 上出现）---"
        Select-String -Path scripts/togo_desktop.spec -Pattern "_EXE_MACOS_ONLY|argv_emulation|target_arch"

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          tauri/package-lock.json

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    # .cargo/config.toml 把 target-dir 指向 tauri/build/target
    - name: Rust Cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './tauri/src-tauri -> ../build/target'
        key: x86_64-pc-windows-msvc
        cache-on-failure: true

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Create venv and install backend deps
      run: |
        python -m venv .venv
        ./.venv/Scripts/python.exe -m pip install --upgrade pip
        ./.venv/Scripts/python.exe -m pip install -r requirements.txt pyinstaller
        ./.venv/Scripts/python.exe -c "import sys, platform; print('venv python', sys.version.split()[0], platform.machine())"
        ./.venv/Scripts/python.exe -c "import mcp2cli, importlib.metadata as m; print('mcp2cli', m.version('mcp2cli'))"

    - name: Install node dependencies
      run: |
        Push-Location frontend; npm ci; Pop-Location
        Push-Location tauri; npm ci; Pop-Location

    # 前后端分三步跑，而不是 `build_desktop.py --action frontend,backend`：
    # 那个脚本内部用 subprocess 直接调 `npm`，而 Windows 上只有 npm.cmd，无 shell 时
    # CreateProcess 找不到（实测 run 43617826032: FileNotFoundError [WinError 2]）。
    # build_desktop.py 不属本单允许改动的文件，所以前端构建交给 shell，同步+哈希校验用
    # scripts/sync_frontend_assets.py 复刻同一判据，后端仍用官方 build_backend.py。
    - name: Verify version consistency
      run: ./.venv/Scripts/python.exe scripts/verify_versions.py

    - name: Build frontend (vite)
      working-directory: frontend
      run: npm run build

    - name: Sync frontend dist -> assets/frontend (双份哈希比对)
      run: ./.venv/Scripts/python.exe scripts/sync_frontend_assets.py

    - name: Build backend (PyInstaller onedir -> tauri/build/backend)
      run: ./.venv/Scripts/python.exe tauri/scripts/build_backend.py --arch x86_64

    - name: Build Tauri bundle (NSIS)
      working-directory: tauri
      env:
        # beforeBuildCommand 会再调一次 build_backend.py；后端已构建则跳过（避免重复打包）
        TOGOSPACE_SKIP_BACKEND_BUILD: '1'
      run: npx tauri build --bundles nsis

    - name: Locate installer
      id: locate
      run: |
        $root = 'tauri/build/target/release/bundle/nsis'
        if (-not (Test-Path $root)) { Write-Host "::error::NSIS 产物目录不存在: $root"; exit 1 }
        $files = Get-ChildItem -Path $root -Filter *.exe -Recurse
        if ($files.Count -eq 0) { Write-Host "::error::$root 下没有 .exe 安装包"; exit 1 }
        $files | ForEach-Object { Write-Host "  candidate: $($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }
        "path=$($files[0].FullName)" >> $env:GITHUB_OUTPUT
        "name=$($files[0].Name)" >> $env:GITHUB_OUTPUT

    # ── A 安装包层 ────────────────────────────────────────────────────────────
    # 体积区间依据：首次成功构建的实收值 ±（见报告「产物体积基线」一节）。
    # 区间的作用是抓「打包漏资产 / 后端树没进去」这类事故，不是精确判据，
    # 所以给的是宽区间；真基线出来后按实测收敛（改这里，不改验证脚本）。
    - name: "Verify installer (A: 存在 / 体积 / sha256)"
      # 体积区间依据（实测基线，不拍脑袋）：run 43618734788 产物
      #   Togobot_0.5.2-beta1_x64-setup.exe = 66 818 781 字节（63.7 MB），
      #   sha256=e2215fa8441569ad9cc26ce94cd824365b09fe9465e3ac2531690c8869615e73。
      # 取 ±20% ⇒ [51, 76] MB。判据用途是抓「后端树没打进去 / 资产漏了 / 误打包了别的东西」，
      # 不是精确体积管控；真基线变了（依赖升级、资产更新）就按同口径重设并写明新基线。
      run: |
        ./.venv/Scripts/python.exe scripts/verify_win_bundle.py bundle `
          --path "${{ steps.locate.outputs.path }}" --min-mb 51 --max-mb 76

    # ── B 后端层：拿构建出来的后端可执行文件真跑 ───────────────────────────────
    - name: "Verify backend executable (B: 空跑 + 真启动 + 真 HTTP + stdin 停机)"
      run: ./.venv/Scripts/python.exe scripts/verify_win_bundle.py backend-smoke --exe tauri/build/backend/Togobot-backend.exe

    # ── marker 契约的变异自证（#245）────────────────────────────────────────────
    # B1 判「错误 marker 能可读地打出来 + exit 2」；这步证明那条判据有牙：
    # 同一判据对「去掉编码修复」的变异体必须变红，否则修没修都绿。
    - name: "Marker contract mutation self-check (#245)"
      run: |
        ./.venv/Scripts/python.exe scripts/verify_win_bundle.py marker-contract `
          --repo-root . --python ./.venv/Scripts/python.exe

    # ── C 安装层：静默安装后在安装树里复验 ─────────────────────────────────────
    - name: Silent install (NSIS /S)
      run: |
        $dir = 'C:\togotest'
        if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
        Write-Host "installing to $dir ..."
        $process = Start-Process -FilePath "${{ steps.locate.outputs.path }}" -ArgumentList '/S', "/D=$dir" -Wait -PassThru
        Write-Host "installer exit code = $($process.ExitCode)"
        Start-Sleep -Seconds 5
        if (-not (Test-Path $dir)) { Write-Host "::error::静默安装后目录不存在: $dir"; exit 1 }
        Get-ChildItem $dir | Select-Object Mode, Length, Name | Format-Table -AutoSize | Out-String | Write-Host

    - name: "Verify installed tree (C: 结构 + 安装树上复跑后端)"
      run: |
        ./.venv/Scripts/python.exe scripts/verify_win_bundle.py installed `
          --dir 'C:\togotest' --smoke-exe 'C:\togotest\backend\Togobot-backend.exe'

    - name: Show artifact digest
      run: |
        $p = "${{ steps.locate.outputs.path }}"
        $hash = (Get-FileHash -Algorithm SHA256 -Path $p).Hash.ToLower()
        $size = (Get-Item $p).Length
        "file=${{ steps.locate.outputs.name }}" | Tee-Object -FilePath artifact-digest.txt
        "size_bytes=$size"                        | Tee-Object -Append -FilePath artifact-digest.txt
        "sha256=$hash"                            | Tee-Object -Append -FilePath artifact-digest.txt
        Get-Content artifact-digest.txt

    - name: Upload installer artifact
      id: upload-installer
      # 两个条件都要：①always() —— 构建成功但验证红时也要能取到产物人工分析；
      # ②locate 真的有产物 —— 否则空 path 会让本步骤红，把真正的失败原因（前面的构建/验证步骤）
      #   埋进「No files were found with the provided path」里（run 43617333776 就是这么被埋的）。
      if: always() && steps.locate.outputs.path != ''
      uses: actions/upload-artifact@v7
      with:
        name: windows-nsis-installer
        path: |
          ${{ steps.locate.outputs.path }}
          artifact-digest.txt
        # digest 文件是后面一步才写的：构建早就红了的时候它不存在，不该因此再红一次
        if-no-files-found: warn
        retention-days: 30

    # ── 产物元数据（#250，SignPath Artifact Configuration 要求）─────────────────
    # SignPath 侧要求：product name = 项目名、product version 每次一致（用于版本一致性校验）。
    # 这里直接读安装包 NSIS 里的 VERSIONINFO，而不是「我读 config 觉得它是稳定的」。
    - name: "Verify installer metadata (ProductName / ProductVersion)"
      shell: pwsh
      run: |
        $p = "${{ steps.locate.outputs.path }}"
        $v = (Get-Item -LiteralPath $p).VersionInfo
        Write-Host "FileDescription = $($v.FileDescription)"
        Write-Host "ProductName     = $($v.ProductName)"
        Write-Host "ProductVersion  = $($v.ProductVersion)"
        Write-Host "FileVersion     = $($v.FileVersion)"
        Write-Host "CompanyName     = $($v.CompanyName)"
        $failures = @()
        if ($v.ProductName -ne 'Togobot') {
          $failures += "ProductName='$($v.ProductName)'，期望 'Togobot'（SignPath Artifact Configuration 要求 product name = 项目名）"
        }
        if (-not $v.ProductVersion) {
          $failures += "ProductVersion 为空 ⇒ SignPath 无法做「每次版本号一致」的校验"
        }
        if ($failures.Count -gt 0) {
          foreach ($f in $failures) { Write-Host "::error::$f" }
          exit 1
        }
        Write-Host "=== 产物元数据符合 SignPath 要求（ProductName=Togobot / ProductVersion 非空）==="
        "## 产物元数据`n`nProductName=``$($v.ProductName)`` ProductVersion=``$($v.ProductVersion)``" >> $env:GITHUB_STEP_SUMMARY

    # ── 本次是否签名：把「未签名」这件事显式写在日志与 job summary 里（#250 红线）──
    - name: "Signing status（本次产物是否签名）"
      shell: pwsh
      run: |
        $ref = "${{ github.ref }}"
        if ($ref.StartsWith('refs/tags/v')) {
          Write-Host "本次是发布 tag 构建（$ref）：签名由后面的 sign-win job 执行（需要 SignPath 凭据）。"
          "## ✍️ 签名状态：tag 构建，交由 sign-win job 处理（``$ref``）" >> $env:GITHUB_STEP_SUMMARY
        } else {
          Write-Host "::warning::本 run 产物未签名，签名只发生在 tag：当前触发 ref = $ref 不是发布 tag；签名只对 refs/tags/v* 提交（SignPath 策略）。"
          "## ⏭️ 本 run 产物未签名，签名只发生在 tag`n`n原因：当前 ref = ``$ref``，不是发布 tag；签名只对 ``refs/tags/v*`` 提交（SignPath 策略）。`n`nartifact 名：``windows-nsis-installer``（UNSIGNED —— **不要当已签名的发布物使用**）。" >> $env:GITHUB_STEP_SUMMARY
        }

    # ── 供签名的产物（#250）────────────────────────────────────────────────────
    # 单独上传「只含安装包的 zip」：
    #   SignPath 的 Artifact Configuration 根元素是 <zip-file>，zip 里元素越少越不容易配错；
    #   上面那个 artifact 里还混了 artifact-digest.txt，不适合直接当签名输入。
    # 只在发布 tag 上跑，避免分支 push 每次都多传 60+ MB。
    - name: Upload installer for signing
      id: upload-for-signing
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v7
      with:
        name: windows-nsis-installer-for-signing
        path: ${{ steps.locate.outputs.path }}
        if-no-files-found: error
        retention-days: 7

    # ── Authenticode 校验本身的判据自证（#250）────────────────────────────────
    # 交付标准要求：即使本次拿不到签名产物，也要证明「校验逻辑会判 Valid=False，而不是恒真绿」。
    # 四个方向一起跑，缺一个都说明判据没牙：
    #   ① 未签名安装包 + -Expect NotSigned            ⇒ 通过（能读出 NotSigned）
    #   ② 未签名安装包 + -Expect Valid                ⇒ 必须失败（Valid 判据不是恒真）
    #   ③ 系统自带已签名程序 + -Expect Valid(Microsoft) ⇒ 通过（Valid 判据与主体断言可用）
    #   ④ 系统自带已签名程序 + 期望主体 SignPath Foundation ⇒ 必须失败（主体断言有牙）
    - name: "Authenticode check self-proof (unsigned ⇒ NotSigned / Valid 判据有牙)"
      shell: pwsh
      run: |
        $installer = "${{ steps.locate.outputs.path }}"
        $signedSystemBinary = "$env:SystemRoot\System32\notepad.exe"
        $script = "scripts/verify_authenticode.ps1"

        # 注意：GitHub 的 pwsh 包装器在脚本末尾会用 $LASTEXITCODE 当本步骤退出码。
        # 本步骤里有两次「故意让它失败」的调用（②④），所以每次调用后必须把
        # $LASTEXITCODE 归零，否则步骤会带着 1 退出 —— run 43663044483 就是这么红的
        # （4 个方向全对，步骤却红了）。判据结果改用显式变量与 exit 表达。
        function Invoke-AuthCheck {
          param([string[]]$CheckArgs)
          pwsh -NoProfile -File $script @CheckArgs | Out-Host
          $code = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          return $code
        }
        $failures = @()

        Write-Host "=== ① 未签名安装包 + -Expect NotSigned（应通过）==="
        $c1 = Invoke-AuthCheck @('-Path', $installer, '-Expect', 'NotSigned')
        if ($c1 -ne 0) { $failures += "①未签名产物未被判为 NotSigned（exit=$c1）" }
        else { Write-Host "✅ ①通过：读出了 NotSigned" }

        Write-Host "=== ② 未签名安装包 + -Expect Valid（必须失败）==="
        $c2 = Invoke-AuthCheck @('-Path', $installer, '-Expect', 'Valid')
        if ($c2 -eq 0) { $failures += "②-Expect Valid 在未签名产物上竟然通过 ⇒ 判据恒真，无牙" }
        else { Write-Host "✅ ②如预期失败（exit=$c2）⇒ Valid 判据不是恒真" }

        Write-Host "=== ③ 系统已签名程序 + -Expect Valid -ExpectedSubject Microsoft（应通过）==="
        $c3 = Invoke-AuthCheck @('-Path', $signedSystemBinary, '-Expect', 'Valid', '-ExpectedSubject', 'Microsoft')
        if ($c3 -ne 0) { $failures += "③已签名程序未被判为 Valid ⇒ Valid 判据在真签名上不成立（exit=$c3）" }
        else { Write-Host "✅ ③通过：真签名被判 Valid 且主体匹配 Microsoft" }

        Write-Host "=== ④ 系统已签名程序 + 期望主体 SignPath Foundation（必须失败）==="
        $c4 = Invoke-AuthCheck @('-Path', $signedSystemBinary, '-Expect', 'Valid', '-ExpectedSubject', 'SignPath Foundation')
        if ($c4 -eq 0) { $failures += "④主体断言在错误主体上竟然通过 ⇒ 主体判据恒真" }
        else { Write-Host "✅ ④如预期失败（exit=$c4）⇒ 主体断言有牙" }

        if ($failures.Count -gt 0) {
          foreach ($f in $failures) { Write-Host "::error::$f" }
          "## ❌ Authenticode 判据自证失败`n`n" + ($failures -join "`n") | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit 1
        }
        Write-Host "=== Authenticode 判据自证全部通过（4/4）==="
        "## ✅ Authenticode 判据自证 4/4：未签名⇒NotSigned / 同一文件 -Expect Valid 失败 / 真签名⇒Valid / 错主体⇒失败" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
        exit 0

  # ── 签名阶段（#250）──────────────────────────────────────────────────────────
  # 只在发布 tag 上跑：分支 push 不提交签名请求（SignPath 策略要求）。
  # 全部跑在 GitHub 托管 runner 上（SignPath OSS 硬要求，禁止 self-hosted）。
  sign-win:
    name: Sign Windows installer (SignPath)
    needs: build-win
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_EXPECTED_SUBJECT: ${{ vars.SIGNPATH_EXPECTED_SUBJECT }}
    steps:
      - uses: actions/checkout@v6

      # 红线（#250）：缺凭据时绝不允许「没签也报绿」。
      # 这里选择「红」而不是「绿着跳过」：本 job 的 if 已经把非 tag 挡掉了，
      # 能走到这里就说明「这是一次发布构建，本该签名」——此时缺凭据是配置事故，必须炸出来。
      - name: "Preflight: signing credentials"
        shell: pwsh
        run: |
          $missing = @()
          if (-not $env:SIGNPATH_API_TOKEN)         { $missing += 'secrets.SIGNPATH_API_TOKEN' }
          if (-not $env:SIGNPATH_ORGANIZATION_ID)   { $missing += 'vars.SIGNPATH_ORGANIZATION_ID' }
          if (-not $env:SIGNPATH_PROJECT_SLUG)      { $missing += 'vars.SIGNPATH_PROJECT_SLUG' }
          if (-not $env:SIGNPATH_SIGNING_POLICY_SLUG) { $missing += 'vars.SIGNPATH_SIGNING_POLICY_SLUG' }
          if ($missing.Count -gt 0) {
            $reason = "缺签名凭据：" + ($missing -join ', ')
            Write-Host "::error::$reason"
            "## ❌ 签名未执行`n`n$reason`n`n本次为 tag 构建，产物**未签名**，不得作为发布物。" >> $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          Write-Host "签名凭据齐备：org=$($env:SIGNPATH_ORGANIZATION_ID) project=$($env:SIGNPATH_PROJECT_SLUG) policy=$($env:SIGNPATH_SIGNING_POLICY_SLUG)"
          "## ✍️ 签名请求将提交`n`nproject=$($env:SIGNPATH_PROJECT_SLUG) policy=$($env:SIGNPATH_SIGNING_POLICY_SLUG)" >> $env:GITHUB_STEP_SUMMARY

      - name: Submit signing request to SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build-win.outputs.signing-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: "Verify Authenticode signature (Status=Valid + 签名主体)"
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path signed -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::SignPath 输出目录里没有 .exe"; exit 1 }
          pwsh -NoProfile -File scripts/verify_authenticode.ps1 `
            -Path $exe.FullName -Expect Valid -ExpectedSubject "$env:SIGNPATH_EXPECTED_SUBJECT"
          $code = $LASTEXITCODE
          $global:LASTEXITCODE = 0   # 同上：别让残留的 LASTEXITCODE 决定本步骤退出码
          if ($code -ne 0) { Write-Host "::error::签名产物校验失败（Status 非 Valid 或主体不符）"; exit 1 }
          $sha = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLower()
          "file=$($exe.Name)" | Tee-Object -FilePath signed-digest.txt
          "sha256=$sha" | Tee-Object -Append -FilePath signed-digest.txt
          Write-Host "✅ 签名产物校验通过，sha256=$sha"
          exit 0

      - name: Upload signed installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis-installer-signed
          path: |
            signed/
            signed-digest.txt
          if-no-files-found: error
          retention-days: 30
