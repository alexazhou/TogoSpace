name: Release Desktop

# tag 发版：构建 arm64 / x86_64 的签名 + 公证 DMG，并创建 GitHub Release。
# 构建步骤与分支 CI 共用 build-desktop.yml；tag 形如 v0.3.12，-beta tag 只构建不发布。
# 正式 tag 的 Release 默认建为 **draft**，需人工检查产物后手动发布。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    name: Build macOS App (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    uses: ./.github/workflows/build-desktop.yml
    with:
      arch: ${{ matrix.arch }}
      target: ${{ matrix.target }}
    secrets: inherit

  release:
    name: Publish GitHub Release
    needs: build-mac
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    # 不带 pattern：下载本 run 的全部 artifact 并合并到 build/。
    # build-mac 是唯一产出 artifact 的 job（build-desktop.yml 上传为
    # macOS-dmg-<arch> 的 zip），不写死名字可避免 artifact 命名约定一变就失效
    # ——v0.4.1 首次发版正是因为只按 macOS-dmg-* 匹配而取不到产物。
    - uses: actions/download-artifact@v7
      with:
        path: build
        merge-multiple: true

    - name: Show artifacts
      run: |
        echo "--- downloaded files ---"
        find build -maxdepth 2 -type f | sort || true
        ls -lh build/*.dmg

    # 两个架构缺一不可，缺了就直接失败，而不是发一个只有单架构的 Release
    - name: Verify both arch DMGs present
      run: |
        set -e
        missing=0
        for arch in arm64 x86_64; do
          if ! ls build/*_${arch}.dmg >/dev/null 2>&1; then
            echo "::error::missing DMG for arch: ${arch}"
            missing=1
          fi
        done
        test "$missing" -eq 0

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: "Togobot ${{ github.ref_name }}"
        tag_name: ${{ github.ref_name }}
        # 默认 draft：tag 推上去后只生成未发布的草稿，DMG 与说明都在里面，
        # 由人检查过再手动点发布。这样即使 tag 误推、或产物有问题，也不会直接
        # 对外可见。要改回自动发布就把这里改成 false。
        draft: true
        prerelease: false
        files: build/*.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
