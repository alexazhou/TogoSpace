name: Release Desktop

# tag 发版：构建 arm64 / x86_64 的签名 + 公证 DMG，并创建 GitHub Release。
# 构建步骤与分支 CI 共用 build-desktop.yml；tag 形如 v0.3.12，-beta tag 只构建不发布。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    name: Build macOS App (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    uses: ./.github/workflows/build-desktop.yml
    with:
      arch: ${{ matrix.arch }}
      target: ${{ matrix.target }}
    secrets: inherit

  release:
    name: Publish GitHub Release
    needs: build-mac
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/download-artifact@v7
      with:
        pattern: macOS-dmg-*
        path: build
        merge-multiple: true

    - name: Show artifacts
      run: ls -lh build/*.dmg

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: "TogoSpace ${{ github.ref_name }}"
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: build/*.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
