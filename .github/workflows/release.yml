name: Release Desktop

# tag 发版：构建 arm64 / x86_64 的签名 + 公证 DMG 与 Windows x64 签名 NSIS 安装包，
# 并创建 GitHub Release。构建步骤与分支 CI 共用 build-desktop.yml /
# build-desktop-windows.yml；tag 形如 v0.3.12，-beta tag 只构建不发布。
# 正式 tag 的 Release 默认建为 **draft**，需人工检查产物后手动发布。
#
# Windows 安装包在 tag 构建中由 SignPath 签名（#250）；缺少签名凭据时
# build-windows 会失败，release job 不会执行。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    name: Build macOS App (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    uses: ./.github/workflows/build-desktop.yml
    with:
      arch: ${{ matrix.arch }}
      target: ${{ matrix.target }}
    secrets: inherit

  build-windows:
    name: Build Windows App (x86_64)
    uses: ./.github/workflows/build-desktop-windows.yml
    secrets: inherit

  release:
    name: Publish GitHub Release
    needs: [build-mac, build-windows]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-beta') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    # 只取需要的产物：macOS DMG 与签名后的 Windows 安装包。
    # 不下载 build-win 的未签名 artifact，避免同名安装包互相覆盖；签名产物由
    # windows-nsis-installer-signed 提供（SignPath 输出在 signed/ 子目录下）。
    - name: Download macOS DMGs
      uses: actions/download-artifact@v7
      with:
        pattern: 'macOS-dmg-*'
        path: build
        merge-multiple: true

    - name: Download signed Windows installer
      uses: actions/download-artifact@v7
      with:
        pattern: 'windows-nsis-installer-signed'
        path: build-windows
        merge-multiple: true

    - name: Flatten signed Windows installer
      run: |
        set -euo pipefail
        installer=$(find build-windows -type f -name '*-setup.exe' | head -n 1)
        if [ -z "$installer" ]; then
          echo "::error::missing signed Windows NSIS installer artifact"
          exit 1
        fi
        cp "$installer" build/
        echo "signed installer: $installer"

    - name: Show artifacts
      run: |
        echo "--- downloaded files ---"
        find build -maxdepth 2 -type f | sort || true
        ls -lh build/*.dmg build/*-setup.exe

    # 两个 macOS 架构与 Windows 安装包缺一不可，缺了就直接失败，
    # 而不是发一个缺平台或缺架构的 Release。
    - name: Verify release artifacts present
      run: |
        set -e
        missing=0
        for arch in arm64 x86_64; do
          if ! ls build/*_${arch}.dmg >/dev/null 2>&1; then
            echo "::error::missing DMG for arch: ${arch}"
            missing=1
          fi
        done
        if ! ls build/*-setup.exe >/dev/null 2>&1; then
          echo "::error::missing Windows NSIS installer"
          missing=1
        fi
        test "$missing" -eq 0

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        name: "Togobot ${{ github.ref_name }}"
        tag_name: ${{ github.ref_name }}
        # 默认 draft：tag 推上去后只生成未发布的草稿，DMG 与说明都在里面，
        # 由人检查过再手动点发布。这样即使 tag 误推、或产物有问题，也不会直接
        # 对外可见。要改回自动发布就把这里改成 false。
        draft: true
        prerelease: false
        files: |
          build/*.dmg
          build/*-setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
