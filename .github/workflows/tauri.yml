name: Tauri Build

# 分支 CI：构建 macOS（.dmg）与 Windows（NSIS .exe）Tauri 桌面安装包，
# 产物只上传为 workflow artifact。tag 发版见 release.yml；
# 两个平台分别共用 build-desktop.yml / build-desktop-windows.yml 的构建流程。

on:
  workflow_dispatch:
  push:
    branches:
      - tauri_dev          # 开发分支推送即构建，便于验证 CI 链路

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    name: Build macOS App (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    uses: ./.github/workflows/build-desktop.yml
    with:
      arch: ${{ matrix.arch }}
      target: ${{ matrix.target }}
    secrets: inherit

  build-windows:
    name: Build Windows App (x86_64)
    uses: ./.github/workflows/build-desktop-windows.yml
    secrets: inherit
