name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., 0.1.20, latest)'
        required: true
        default: 'latest'
        type: string
      push:
        description: 'Push image to registry'
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Docker Image (${{ matrix.platform }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
            suffix: arm64

    steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}
        lfs: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ secrets.DOCKERHUB_USERNAME }}/togospace
          ghcr.io/${{ github.repository_owner }}/togospace
        flavor: |
          latest=false
          suffix=-${{ matrix.suffix }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=
          type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta') }}

    - name: Build and push Docker image (platform-specific)
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name == 'push' || inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: ${{ matrix.platform }}
        provenance: false

  merge:
    name: Merge and Push Manifest
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    if: ${{ github.event_name == 'push' || inputs.push }}

    steps:
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ secrets.DOCKERHUB_USERNAME }}/togospace
          ghcr.io/${{ github.repository_owner }}/togospace
        flavor: |
          latest=false
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix=
          type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
          type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta') }}

    - name: Create and push manifest list
      run: |
        tags='${{ steps.meta.outputs.tags }}'
        main_tag=$(echo "$tags" | head -1)

        # 用 buildx imagetools 创建 multi-arch manifest（基于两个平台的远程镜像）
        docker buildx imagetools create -t "$main_tag" \
            "$main_tag-amd64" \
            "$main_tag-arm64"

        # 其余别名 tag（0.3 / sha / latest / 手动 tag）同样生成
        for tag in $tags; do
            if [ "$tag" != "$main_tag" ]; then
                docker buildx imagetools create -t "$tag" \
                    "$tag-amd64" \
                    "$tag-arm64"
            fi
        done

        # 汇总到 step summary
        echo "### Docker Multi-arch Manifests" >> $GITHUB_STEP_SUMMARY
        for tag in $tags; do
            echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
        done

    - name: Delete platform-specific tags (Docker Hub)
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" \
        DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}" \
        bash scripts/docker_hub_delete_platform_tags.sh "${TAGS}"